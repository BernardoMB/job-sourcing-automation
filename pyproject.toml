[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.1.0"
description = "The Steward: a local, self-hosted, human-in-the-loop harness that runs your recruiter-facing job search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.7",
    "rich>=13",
    "typer>=0.12",
    "python-dotenv>=1",
    "tzdata",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
steward = "steward.cli:app"

[tool.setuptools.packages.find]
include = ["steward*"]

[tool.setuptools.package-data]
steward = ["web/static/*", "sandbox_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
